[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrack"
version = "0.1.0"
description = "Local-first explainable graph-grounded retrieval with source paths and abstention"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name="Tejas Sarnaik", email="tejassarnaik2120@gmail.com"}]
keywords = ["graphrag", "knowledge-graph", "retrieval", "nlp", "explainable-ai"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Topic :: Scientific/Engineering :: Artificial Intelligence"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
graphrack = "graphrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
